name: Inhoud

# Controleert elke pull request op bronnen en bepaalt hoeveel nalezers nodig zijn.
# - De job "inhoud" faalt alleen bij een inhoudelijke fout (bron ontbreekt, dosering, ...).
# - Het aantal goedkeuringen staat in een aparte status "nazicht": "in afwachting" zolang
#   er te weinig nalezers zijn, "geslaagd" zodra het genoeg is. Geen foutmeldingen dus
#   voor iets wat gewoon nog moet gebeuren.
# Branch protection op main vraagt beide: "inhoud" en "nazicht".

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  inhoud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Gewijzigde bestanden
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh api "repos/${{ github.repository }}/pulls/$PR/files" --paginate --jq '.[].filename' > gewijzigd.txt

      - name: Bronnen controleren en nazicht bepalen
        run: python3 pipeline/controleer_inhoud.py --gewijzigd $(cat gewijzigd.txt) --uitvoer oordeel.json

      - name: Labels zetten
        if: always() && hashFiles('oordeel.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          jq -r '.labels[]' oordeel.json | while IFS= read -r naam; do
            gh label create "$naam" --repo "${{ github.repository }}" --color BFD4F2 2>/dev/null || true
            gh pr edit "$PR" --repo "${{ github.repository }}" --add-label "$naam"
          done

      - name: Status nazicht (goedkeuringen)
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          nodig=$(jq '.goedkeuringen_nodig' oordeel.json)
          # Laatste oordeel per nalezer; de auteur telt niet mee.
          auteur="${{ github.event.pull_request.user.login }}"
          aantal=$(gh api "repos/${{ github.repository }}/pulls/$PR/reviews" --paginate \
            --jq "[.[] | select(.user.login != \"$auteur\")] | group_by(.user.login) | map(last) | map(select(.state == \"APPROVED\")) | length")
          echo "Goedkeuringen: $aantal van $nodig"
          if [ "$aantal" -ge "$nodig" ]; then staat=success; else staat=pending; fi
          gh api -X POST "repos/${{ github.repository }}/statuses/$SHA" \
            -f state="$staat" -f context="nazicht" \
            -f description="$aantal van $nodig goedkeuring(en) door nalezers" \
            -f target_url="https://github.com/${{ github.repository }}/blob/main/docs/nazicht.md" >/dev/null
